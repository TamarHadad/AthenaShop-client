<div class="login-container">
    <h2>Login</h2>
  
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" />
  
        <small *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
          Email is required
        </small>
  
        <small *ngIf="loginForm.get('email')?.hasError('pattern') && loginForm.get('email')?.touched">
          Invalid email format
        </small>
      </div>
  
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" />
  
        <small *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
          Password is required
        </small>
  
        <small *ngIf="loginForm.get('password')?.hasError('pattern') && loginForm.get('password')?.touched">
          Password must contain uppercase, lowercase and a number
        </small>
      </div>
  
      <button type="submit">Login</button>
  
      <small *ngIf="loginError">{{ loginError }}</small>
  
      <p class="switch-page">
        Don't have an account?
        <a routerLink="/sign-up">Sign Up</a>
      </p>
    </form>
  </div>
