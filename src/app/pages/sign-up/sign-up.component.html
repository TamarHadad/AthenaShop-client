<div class="register-container">
    <h2>Sign Up</h2>
  
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" />
  
        <small *ngIf="registerForm.get('email')?.hasError('required') && registerForm.get('email')?.touched">
          Email is required
        </small>
  
        <small *ngIf="registerForm.get('email')?.hasError('pattern') && registerForm.get('email')?.touched">
          Invalid email format
        </small>
      </div>
  
      <div class="form-group">
        <label for="userName">User Name</label>
        <input id="userName" type="text" formControlName="userName" />
  
        <small *ngIf="registerForm.get('userName')?.hasError('required') && registerForm.get('userName')?.touched">
          User name is required
        </small>
  
        <small *ngIf="registerForm.get('userName')?.hasError('minlength') && registerForm.get('userName')?.touched">
          Minimum 2 characters
        </small>
      </div>
  
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" />
  
        <small *ngIf="registerForm.get('password')?.hasError('required') && registerForm.get('password')?.touched">
          Password is required
        </small>
  
        <small *ngIf="registerForm.get('password')?.hasError('pattern') && registerForm.get('password')?.touched">
            Password must contain uppercase, lowercase and a number
          </small>
      </div>
  
      <button type="submit">Register</button>
      <p class="switch-page">
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>
    </form>
  </div>
