<div class="home-container">

  <section class="hero-section">
    <div class="hero-text">
      <p class="small-title">Sneakers Collection</p>
      <h1>{{ newestShoe.name }}</h1>
      <p class="description">
        The newest sneaker in our collection with modern style and premium comfort.
      </p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <div class="hero-image">
      <img [src]="newestShoe.image" [alt]="newestShoe.name" />
    </div>
  </section>

  <section class="top-picks">
    <h2>Top Picks</h2>
  
    <div class="cards">
      <app-shoe-card
        *ngFor="let shoe of topPicks"
        [shoe]="shoe"
        [showButton]="false">
      </app-shoe-card>
    </div>
  </section>

  <section class="about-section">
    <div class="about-text">
      <h2>About AthenaShop</h2>
      <p>
        AthenaShop brings together top sneaker brands, clean design, and a simple
        shopping experience for every sneaker lover.
      </p>
    </div>

    <div class="about-image">
      <img [src]="mostPopular.image" [alt]="mostPopular.name" />
    </div>
  </section>

</div>
